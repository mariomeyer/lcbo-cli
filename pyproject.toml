[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcbo-cli"
version = "0.1.0"
description = "Typed LCBO product search, prices, inventory, proximity, and HAR capture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "beautifulsoup4>=4.12,<5", "rich>=13.9,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/mariomeyer/lcbo-cli"
Documentation = "https://github.com/mariomeyer/lcbo-cli#readme"

[project.scripts]
lcbo = "lcbo_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lcbo_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
