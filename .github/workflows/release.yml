name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest

  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_relevant: ${{ steps.changes.outputs.release_relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.2"
          python-version: "3.12"
      - name: Check whether the push changed more than documentation
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            uv run --no-project python scripts/release_changes.py \
              --base "$BEFORE_SHA" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "release_relevant=true" >> "$GITHUB_OUTPUT"
          fi
      - run: uv build
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Smoke test the installed wheel
        run: uvx --from ./dist/lcbo-*.whl lcbo --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  release:
    name: Semantic version and GitHub release
    needs: [tests, build]
    # Enable only after the PyPI Trusted Publisher and pypi environment exist.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.build.outputs.release_relevant == 'true' &&
      vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that only the tested commit is released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "main has moved since this run started; refusing a stale release."
            exit 1
          fi
          git switch -C main "$GITHUB_SHA"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.2"
          python-version: "3.12"
      - name: Create semantic version, changelog, tag and GitHub release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from python-semantic-release==10.7.0 semantic-release version
      - name: Check release distributions
        if: steps.version.outputs.released == 'true'
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version.outputs.released == 'true'
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
      - name: Attach distributions to GitHub release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from python-semantic-release==10.7.0 semantic-release publish

  pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lcbo/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
